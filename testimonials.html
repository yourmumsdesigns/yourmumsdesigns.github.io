<h1>Teamwork Makes The Dream Work</h1>

<div class="t-list">

<figure class="t-card">
  <img class="avatar" src="assets/testimonials/byron.png" alt="" width="88" height="88">
  <figcaption>
    <div class="t-name">Byron McCarthy</div>
    <div class="t-role">Head Of Product Operations</div>
    <div class="t-meta">April 23, 2026, Byron managed Chanél directly</div>
  </figcaption>
  <blockquote>
    <p>I had the privilege of working closely with Chanel in the Work Product Management (WPM) value stream at Co-Flo, where she was our sole Senior Product Designer &amp; genuinely one of the strongest designers I’ve worked with.</p>
    <p>Chanel brings a rare combination of deep user empathy, sharp business understanding &amp; true systems thinking. She doesn’t just design interfaces, she designs solutions. Every output reflects a clear grasp of the user problem, the business goal or bet behind it &amp; how to balance those into something intuitive, scalable &amp; commercially meaningful.</p>
    <p>During her time with us, Chanel led design across critical initiatives, including full task management &amp; work orchestration features, &amp; played a key role in shaping the Key &amp; Critical Dates framework for a legal WPM product. She didn’t just deliver, she elevated how we worked, defining design standards &amp; processes, strengthening discovery &amp; ideation &amp; actively partnering with Product to improve the product itself &amp; unlock new opportunities.</p>
    <p>She’s also incredibly fluent in applying AI within design workflows, not as a crutch, but as an accelerator, while maintaining a level of craft, judgment &amp; originality that goes far beyond what AI alone can produce.</p>
    <p>From a working style perspective, Chanel is everything you want in a senior partner, reliable, self-managing, proactive, ambitious &amp; just an all-round pleasure to work with. She brings great energy into a team, contributes to culture naturally &amp; can be trusted to own her space end-to-end without oversight.</p>
    <p>Her departure from Co-Flo was purely due to company funding constraints, not performance &amp; losing her was a genuine loss.</p>
    <p>I’d hire Chanel again in a heartbeat. Any team looking for a high-impact, forward-thinking designer who truly understands the intersection of user, business &amp; modern AI capability will be very lucky to have her.</p>
  </blockquote>
</figure>

<figure class="t-card">
  <img class="avatar" src="assets/testimonials/josh.png" alt="" width="88" height="88">

    <div class="t-name">Josh Grant</div>
    <div class="t-role">Product Design Team Lead @ Lula | Fintech | Product Strategy | Driving Innovation &amp; User-Centered Design</div>

  <blockquote>
    <p>Chanél has been a standout member of our UX team at Lula. She consistently brings creativity, attention to detail, and a strong sense of ownership to her work. She’s collaborative, thoughtful in her approach, and has a natural ability to balance user needs with business goals.</p>
    <p>What stands out most is her willingness to support the team when needed and the calm, professional way she handles challenges. As her manager, I could always trust that Chanel would fully own her projects and see them through with quality and commitment — a quality that makes her an invaluable member of the team.</p>
    <p>For anyone lucky enough to work with her in the future, two pro tips: put Chanél in charge of design presentations — and make sure there’s good coffee around!</p>
    <p>Keep being endlessly curious, Chanél.</p>
  </blockquote>
</figure>

<figure class="t-card">

    <p>It was a pleasure working alongside Chanél during her time as a Product Designer at Gumtree. Chanél brought an exceptional ability to simplify complex flows and craft intuitive, user-centric experiences that made a significant impact on our product offerings.</p>
    <p>Her proactive nature and collaborative spirit made her an invaluable team player. Chanél consistently went above and beyond, contributing creative ideas and ensuring the best outcomes for both the business and our users.</p>
    <p>Beyond her professional skills, Chanél’s sense of humor and light-heartedness brought a unique energy to the team, fostering a positive and engaging work environment that we all cherished.</p>

<figure class="t-card">
  <img class="avatar" src="assets/testimonials/justin.png" alt="" width="88" height="88">
  <figcaption>
    <div class="t-name">Justin Evans</div>
    <div class="t-role">Fractional Product &amp; Experience Designer<br>UX • Product Strategy • Gamification</div>
  </figcaption>
  <blockquote>
    <p>Chanél is one of those designers that you just imprint on. Not only is she an amazing personality, her work ethic and quality of results makes her a gem in the industry.</p>
    <p>I have been in the UX industry for nearly 15 years and Chanél has left an impression on me that will forever be the highlight of my career. I saw magic in her and she delivered.</p>
    <p>Her knowledge of user experience and design is amazing! It feels like she has done this for a very long time. She dives deep into the problem and her research skills is top notch. She has a way of building trust with her so you know that any requests or project is in capable hands.</p>
    <p>I really loved working with her and really has been a pleasure being her leader at Ozow. She has such a presence and hr work ethic is top notch. Always delivers, on time and with quality. She works so well with a team and makes everyone feel so comfortable. I love the fact that she is always learning and more importantly always eager to learn! I am so proud of the UX &amp; Product Designer she has become!</p>
    <p>I wish her the best of her bright future! I can tell she was born for this industry and I think she will continue to shine.</p>
  </blockquote>
</figure>

<figure class="t-card">

    <div class="t-role">Senior UX Product Designer (CSPO CSM) 8+ Yrs UX Research &amp; Design Experience</div>

  <blockquote>
    <p>I had the privilege of working with Chanél in her capacity as UX Designer at Ozow and really enjoyed what she has to offer as a multi-talented Designer. She's always curious and asks questions throughout the design process, which helps her to understand the problem space fully. I've seen her research boards, and she leaves no stone unturned!</p>
    <p>Once Chanél understands the requirements and user needs, she can create fully functional Figma prototypes. Her level of expertise and passion she shows for this type of work is truly contagious. She's got a real talent for creating Figma components from scratch, and it's amazing to see her in action.</p>
    <p>Chanél also taught me how to use Autolayout correctly to save time for consistently spacing our layouts. I truly believe that this skill alone is what separates good designers from great ones, and Chanél is an absolute rockstar in this sense! Her work is nothing short of incredible.</p>
    <p>I'm always excited to see what Chanél does next. She's always willing to help, no matter how big or small the task is. She's efficient and effective and always has a joke to crack in between. Certainly, Chanél's exceptional skills and experience in the full design process make her an invaluable asset to any company fortunate enough to have her on their team.</p>
