<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page not found | Chanél Carstens</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --green: #73AB84;
      --dark: #000501;
      --body-bg: #FFFFFC;
      --text-muted: #555;
      --font: 'Inter', sans-serif;
    }
    body {
      font-family: var(--font);
      background: var(--body-bg);
      color: var(--dark);
      font-size: 15px;
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    nav {
      background: var(--body-bg);
      padding: 0 48px;
      height: 60px;
      display: flex;
      align-items: center;
    }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 64px 24px 96px;
    }
    .cat { height: 140px; margin-bottom: 32px; }
    .code {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--green);
      margin-bottom: 12px;
    }
    h1 {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 12px;
    }
    p { color: var(--text-muted); max-width: 420px; margin-bottom: 32px; }
    .home {
      display: inline-block;
      padding: 12px 24px;
      border: 2px solid var(--green);
      border-radius: 2px;
      color: var(--dark);
      font-weight: 600;
      font-size: 14px;
      text-decoration: none;
      box-shadow: -8px 8px 0 0 var(--green);
      transition: background 0.2s;
    }
    .home:hover { background: rgba(115, 171, 132, 0.3); }
    @media (max-width: 600px) {
      nav { padding: 0 16px; }
      h1 { font-size: 26px; }
    }
  </style>
</head>
<body>
  <nav>
    <a href="/" aria-label="Home">
      <svg width="22" height="32" viewBox="0 0 22 32" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M13 0L0 18H9L9 32L22 14H13L13 0Z" fill="#73AB84"/>
      </svg>
    </a>
  </nav>
  <main>
    <img class="cat" src="/assets/cat-contact.png" alt="" />
    <div class="code">404</div>
    <h1>This page wandered off</h1>
    <p>My cat's gone to look for it. In the meantime, there's definitely something worth seeing on the homepage.</p>
    <a class="home" href="/">Take me home</a>
  </main>
</body>
</html>
